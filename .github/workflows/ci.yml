name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday, to catch links that stop working, such as the live dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Markdown lint and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Markdown lint
        run: |
          pip install pymarkdownlnt==0.9.41
          pymarkdown scan README.md
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md
